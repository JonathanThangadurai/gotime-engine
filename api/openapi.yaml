openapi: 3.1.0
info:
  title: GOTime Recommendation API
  version: 0.9.0
  summary: When, how hard and where to run, given heat, air, pollen, cold, wind and the athlete.
  description: |
    One call returns a decision a partner can show as-is (summary), the guidance behind it,
    ranked reasons with their evidence level, and optionally the hour-by-hour timeline.

    Conventions (same as Strava and Garmin FIT where they overlap):
    - SI units, unit in the field name: `_s`, `_m`, `_mps`, `_s_per_km`, `_c`, `_ugm3`, `_ml`, `_deg`, `_pct`.
    - Times are ISO 8601 with the location's UTC offset; `timezone` is an IANA name.
    - Every decision is a stable code plus `params`. `text` is optional, rendered in `lang`, and safe to ignore.
    - Missing data is never reported as a value: `data.status` (ok | degraded | unavailable) and `data.not_assessed`
      say what could not be assessed, and each source carries its age. Without usable weather there is no advice (503).
    - Where a value can be absent for different reasons, an explicit status field says which
      (`guidance.pace.limit_status`, `guidance.start_heading_status`); the value is then null.
    - Levels: 0 green, 1 yellow, 2 red, 3 black (black = do not run outdoors).
    - Times: offsets are computed per instant from the IANA zone (daylight saving time included).
    - Runner-facing fields carry forecast facts and suggestions. Body estimates (heat budget, core temperature, sweat,
      pace limits) are experimental, sit only under `experimental`, and must not be shown to runners.
    - Air uses each guideline's own averaging: WHO 2021 PM2.5, PM10 and NO2 as 24-h means and ozone as the maximum
      8-h mean; India NAQI PM2.5 bands on the 24-h mean; EU ozone 180 / 240 on hourly values (information and alert
      thresholds, not a clearance). Hourly values only rank hours for timing.

    **Prototype (0.9).** This contract may still change. Authentication (bearer) and rate limiting (429) are planned,
    not implemented. `/live` is experimental.
    Advisory only; not medical advice.
servers:
  - url: https://api.gotime.example/v1
    description: Placeholder; the prototype runs locally (see README).
# security: bearer authentication is planned, not implemented in the prototype (see components.securitySchemes)
paths:
  /recommendations:
    post:
      operationId: createRecommendation
      summary: Plan a run for one local date (today by default)
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecommendationRequest" }
      responses:
        "200":
          description: Recommendation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recommendation" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429":
          description: "Planned, not implemented in the prototype: rate limit exceeded."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    get:
      operationId: getRecommendation
      summary: A subset of POST, with query parameters only (for simple clients and watch apps)
      description: >-
        Supports location, duration, pace, date, start_after, start_before and include. Not available on GET:
        athlete, route, context and now (use POST). Missing athlete fields are filled with the declared defaults.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: duration_s, in: query, schema: { type: integer, minimum: 300, maximum: 14400, default: 2700 } }
        - { name: pace_s_per_km, in: query, schema: { type: integer, minimum: 150, maximum: 900, default: 380 } }
        - { name: date, in: query, schema: { type: string, format: date }, description: "Local date of the activity (default: today)." }
        - { name: start_after, in: query, schema: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" } }
        - { name: start_before, in: query, schema: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" } }
        - { name: include, in: query, schema: { type: string, example: "hours" } }
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Recommendation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recommendation" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /live:
    post:
      operationId: liveStep
      summary: "Out of pilot scope (experimental, no further work): in-run guidance"
      x-experimental: true
      description: >-
        Experimental; may change or be removed. Stateless: send back the `state` from the previous response unchanged.
        The state is signed by the server and bound to `recommendation_id`; a tampered, foreign, stale (over 6 hours)
        or out-of-order state (elapsed_s going backwards) is rejected with 400. The core estimate integrates over the
        hours actually run through since the previous step.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiveRequest" }
      responses:
        "200":
          description: Live guidance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: "Planned, not implemented in the prototype (no authentication yet)." }
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: Language for optional `text` fields. Codes are language-free. The prototype ships en-GB.
      schema: { type: string, default: en-GB }
  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    # ---------- shared ----------
    Level:
      type: integer
      enum: [0, 1, 2, 3]
      description: 0 green, 1 yellow, 2 red, 3 black (indoors).
    LevelName:
      type: string
      enum: [green, yellow, red, black]
    Evidence:
      type: string
      description: How solid the basis for this item is.
      enum: [published_standard, published_method, published_slopes, published_threshold, published_consensus, published_research, mechanism, physics, assumption, demo_value, athlete_input]
    Message:
      type: object
      required: [code, params]
      properties:
        code: { type: string, pattern: "^[A-Z][A-Z0-9_]+$", examples: [GO_BEFORE] }
        params:
          type: object
          additionalProperties: { type: [string, number, boolean, "null"] }
        text: { type: string, description: Rendered in the requested language. Optional. }
      additionalProperties: false
    Window:
      type: object
      required: [start, end, latest_start]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time, description: The run should be finished by this time. }
        latest_start: { type: string, format: date-time, description: "end minus the planned duration: the latest start that fits the whole run." }
      additionalProperties: false
    LatLon:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }

    # ---------- request ----------
    RecommendationRequest:
      type: object
      required: [location, activity]
      properties:
        location: { $ref: "#/components/schemas/LatLon" }
        now: { type: string, format: date-time, description: Defaults to server time. }
        activity:
          type: object
          required: [type, planned_duration_s]
          properties:
            type: { type: string, enum: [run, walk], description: "Maps from Strava sport_type Run/TrailRun/Walk and FIT sport running/walking." }
            planned_duration_s: { type: integer, minimum: 300, maximum: 14400 }
            planned_pace_s_per_km: { type: integer, minimum: 150, maximum: 900 }
            planned_speed_mps: { type: number, minimum: 1.1, maximum: 6.7, description: Alternative to pace. }
            date: { type: string, format: date, description: "Local date of the activity at the location (default: today). Up to 4 days ahead." }
            start_after: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Earliest local start time the athlete allows (HH:MM)." }
            start_before: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Latest local start time the athlete allows (HH:MM)." }
          additionalProperties: false
        athlete:
          type: object
          description: All optional. Defaults are listed in the response under `assumptions`.
          properties:
            mass_kg: { type: number, minimum: 30, maximum: 200 }
            height_m: { type: number, minimum: 1.2, maximum: 2.3 }
            heat_acclimatised:
              type: [string, boolean]
              enum: ["yes", "no", "unknown", true, false]
              description: >-
                "yes" when the athlete has trained or worked in the heat repeatedly over the last 1-2 weeks (for example
                most days, an hour or more); it moves the heat bands up by 4.4 °C. "no" or "unknown" use the non-adapted
                bands. There is no city default: when omitted it is "unknown" (declared in assumptions). Booleans are
                accepted for now (deprecated).
            clothing: { type: string, enum: [running_kit, full_length_light, full_length_cotton] }
            hay_fever: { type: boolean }
          additionalProperties: false
        route:
          type: object
          description: Optional. v1 uses it for the start heading; v1.1 adds shade, slope and wind along the route.
          properties:
            id: { type: string }
            polyline: { type: string, description: "Encoded polyline (Google format, as Strava map.summary_polyline)." }
            geojson:
              type: object
              description: GeoJSON LineString, [lon, lat] order.
          additionalProperties: false
        include:
          type: array
          items: { type: string, enum: [hours, experimental, debug] }
          description: "hours: the hour-by-hour timeline. experimental: research-only model output (heat budget), omitted by default."
        context:
          type: string
          enum: [now, evening_before]
          default: now
          description: "`evening_before`: the request is the plan sent the evening before (with activity.date = tomorrow); enables evening-only tips."
      additionalProperties: false

    # ---------- response ----------
    Recommendation:
      type: object
      required: [schema_version, id, generated_at, valid_until, location, activity, summary, guidance, air_today, reasons, assumptions, data, disclaimer]
      properties:
        schema_version: { type: string, const: "0.9.0" }
        id: { type: string, description: Pass to /live as recommendation_id to link a run to its plan. }
        generated_at: { type: string, format: date-time }
        valid_until: { type: string, format: date-time, description: Re-fetch after this time; forecasts update hourly. }
        location:
          type: object
          required: [lat, lon, timezone]
          properties:
            lat: { type: number }
            lon: { type: number }
            timezone: { type: string, examples: [Europe/Amsterdam] }
            label: { type: string }
          additionalProperties: false
        activity:
          type: object
          required: [type, date, planned_duration_s, planned_pace_s_per_km]
          properties:
            type: { type: string, enum: [run, walk] }
            date: { type: string, format: date, description: The local date this recommendation is for. }
            planned_duration_s: { type: integer }
            planned_pace_s_per_km: { type: integer }
          additionalProperties: false
        summary: { $ref: "#/components/schemas/Summary" }
        guidance: { $ref: "#/components/schemas/Guidance" }
        reasons:
          type: array
          description: Most important first.
          items: { $ref: "#/components/schemas/Reason" }
        tips:
          type: array
          description: >-
            "What pros do": pro-level guidance in an everyday dose, from the run hours' conditions.
            The engine returns at most one. Show it quietly, below the main advice.
          items: { $ref: "#/components/schemas/Tip" }
        air_today: { $ref: "#/components/schemas/AirToday" }
        experimental: { $ref: "#/components/schemas/Experimental" }
        hours:
          type: array
          description: Only when include=hours. Remaining hours of the date.
          items: { $ref: "#/components/schemas/Hour" }
        assumptions:
          type: array
          description: Defaults the engine filled in because the request did not say.
          items:
            type: object
            required: [field, value, basis]
            properties:
              field: { type: string, examples: [athlete.heat_acclimatised] }
              value: { type: [string, number, boolean] }
              basis: { type: string, examples: [local_climate, population_default] }
            additionalProperties: false
        data: { $ref: "#/components/schemas/DataInfo" }
        disclaimer: { $ref: "#/components/schemas/Message" }
      additionalProperties: false

    Summary:
      type: object
      description: Everything a notification, watch complication or activity card needs.
      required: [action, level, level_name, window, headline, detail, notification]
      properties:
        action:
          type: string
          enum: [go_now, go_later, go_short, indoor, none_today]
          description: >-
            go_short = go, but shorter or slower than planned (the heat budget or the window does not fit the whole run).
            none_today = no window left on this date that fits even a short run.
        level: { $ref: "#/components/schemas/Level" }
        level_name: { $ref: "#/components/schemas/LevelName" }
        window:
          oneOf: [{ $ref: "#/components/schemas/Window" }, { type: "null" }]
          description: null when action is none_today, or indoor without a least-bad slot (LEAST_BAD_WINDOW).
        headline: { $ref: "#/components/schemas/Message" }
        detail: { $ref: "#/components/schemas/Message" }
        notification:
          type: object
          required: [title, body]
          properties:
            title: { type: string, maxLength: 40 }
            body: { type: string, maxLength: 120 }
          additionalProperties: false
      additionalProperties: false

    Guidance:
      type: object
      required: [intensity, pace, route, start_heading_deg, start_heading_status, hydration, warm_up_indoors, indoor_alternatives]
      properties:
        intensity: { type: string, enum: [normal, easy] }
        pace:
          type: object
          description: No numbers here; experimental pace limits are under `experimental.heat_budget`.
          required: [planned_s_per_km, advice]
          properties:
            planned_s_per_km: { type: integer }
            advice:
              type: string
              enum: [as_planned, consider_shorter_or_easier, indoor]
              description: From the heat bands of the hours the run covers (red or higher -> consider shorter or easier).
          additionalProperties: false
        route:
          oneOf:
            - type: "null"
            - type: object
              required: [id, name, compared_with]
              properties:
                id: { type: string }
                name: { type: string }
                compared_with: { type: [string, "null"] }
              additionalProperties: false
        start_heading_deg:
          type: [integer, "null"]
          description: Start heading (0 = north, clockwise) so the first half is into the wind. Set only when start_heading_status is into_wind.
        start_heading_status:
          type: string
          enum: [into_wind, any, unknown, indoor]
          description: "any = wind too light along the route to matter; unknown = wind direction not available; indoor = no outdoor run advised."
        hydration:
          type: object
          description: Personal sweat estimates are experimental (`experimental.heat_budget`).
          required: [advice, carry_water]
          properties:
            advice: { type: string, enum: [drink_to_thirst, none], description: "drink_to_thirst: show DRINK_TO_THIRST." }
            carry_water: { type: boolean, description: True for runs of 60 minutes or more, or when the run hours are at least yellow for heat. }
          additionalProperties: false
        warm_up_indoors: { type: boolean }
        indoor_alternatives:
          type: array
          items: { $ref: "#/components/schemas/Message" }
      additionalProperties: false

    Tip:
      type: object
      required: [code, evidence, params]
      properties:
        code: { type: string, pattern: "^[A-Z][A-Z0-9_]+$", examples: [TIP_PRECOOL] }
        evidence: { $ref: "#/components/schemas/Evidence" }
        params:
          type: object
          additionalProperties: { type: [string, number, boolean, "null"] }
        text: { type: string }
        skip_if:
          description: Who should not follow this tip (for example a medical condition); null when it applies to everyone.
          anyOf: [{ $ref: "#/components/schemas/Message" }, { type: "null" }]
      additionalProperties: false

    Reason:
      type: object
      required: [factor, code, level, evidence, params]
      properties:
        factor: { type: string, enum: [heat, air, pollen, cold, wind, athlete] }
        code: { type: string, pattern: "^[A-Z][A-Z0-9_]+$" }
        level: { $ref: "#/components/schemas/Level" }
        evidence: { $ref: "#/components/schemas/Evidence" }
        params:
          type: object
          additionalProperties: { type: [string, number, boolean, "null"] }
        text: { type: string }
      additionalProperties: false

    Hour:
      type: object
      required: [start, assessed, level, level_name, in_window, heat, air, cold, pollen, wind]
      properties:
        start: { type: string, format: date-time }
        assessed: { type: boolean, description: false when weather essentials are missing for this hour; it is then left out of every window. }
        level: { oneOf: [{ $ref: "#/components/schemas/Level" }, { type: "null" }] }
        level_name: { oneOf: [{ $ref: "#/components/schemas/LevelName" }, { type: "null" }] }
        in_window: { type: boolean }
        heat:
          oneOf:
            - type: "null"
            - type: object
              required: [wbgt_c, level, air_temp_c, relative_humidity_pct, radiant_temp_c]
              properties:
                wbgt_c: { type: number }
                level: { $ref: "#/components/schemas/Level" }
                air_temp_c: { type: number }
                relative_humidity_pct: { type: number }
                radiant_temp_c: { type: number }
              additionalProperties: false
        air:
          oneOf:
            - type: "null"
            - type: object
              description: Hourly values (timing only). Daily guideline status is in air_today.
              required: [pm25_ugm3, pm10_ugm3, no2_ugm3, o3_ugm3, level, dominant]
              properties:
                pm25_ugm3: { type: [number, "null"], description: null when not assessed }
                pm10_ugm3: { type: [number, "null"], description: null when not assessed }
                no2_ugm3: { type: [number, "null"], description: null when not assessed }
                o3_ugm3: { type: [number, "null"], description: null when not assessed }
                level: { $ref: "#/components/schemas/Level", description: "max(NAQI PM2.5 band of the 24-h mean, EU hourly ozone 180 / 240)" }
                dominant: { type: [string, "null"], enum: [pm25, pm10, no2, o3, null], description: Highest hourly value relative to its guideline. }
              additionalProperties: false
        cold:
          oneOf:
            - type: "null"
            - type: object
              required: [wind_chill_c, level]
              properties:
                wind_chill_c: { type: [number, "null"], description: null above 10 °C, where wind chill is undefined. }
                level: { $ref: "#/components/schemas/Level" }
              additionalProperties: false
        pollen:
          type: object
          description: Per taxon, grains/m³; null = not assessed or not covered. Only grass has a level (50 grains/m³).
          required: [grass_m3, birch_m3, alder_m3, mugwort_m3, grass_level]
          properties:
            grass_m3: { type: [number, "null"] }
            birch_m3: { type: [number, "null"] }
            alder_m3: { type: [number, "null"] }
            mugwort_m3: { type: [number, "null"] }
            grass_level: { oneOf: [{ $ref: "#/components/schemas/Level" }, { type: "null" }] }
          additionalProperties: false
        wind:
          oneOf:
            - type: "null"
            - type: object
              required: [speed_mps, from_deg]
              properties:
                speed_mps: { type: number }
                from_deg: { type: [integer, "null"], description: null when the wind direction is not available }
              additionalProperties: false
        experimental:
          type: object
          description: Research-only heat-budget values for this hour at the planned pace (only with include=experimental). Not for runner screens.
          required: [minutes_to_39c, sweat_rate_ml_per_h, core_steady_c]
          properties:
            minutes_to_39c: { type: [integer, "null"], description: null = no limit (heat can be shed). }
            sweat_rate_ml_per_h: { type: integer }
            core_steady_c: { type: number }
          additionalProperties: false
      additionalProperties: false

    AirToday:
      type: object
      description: The day's air with each guideline's own averaging (the forecast day, 00-24 local). null = not assessed.
      required: [pm25_24h_mean_ugm3, pm10_24h_mean_ugm3, no2_24h_mean_ugm3, o3_max_8h_mean_ugm3, above_who_guideline, naqi_pm25_band]
      properties:
        pm25_24h_mean_ugm3: { type: [integer, "null"], description: WHO 2021 guideline 15. }
        pm10_24h_mean_ugm3: { type: [integer, "null"], description: WHO 2021 guideline 45. }
        no2_24h_mean_ugm3: { type: [integer, "null"], description: WHO 2021 guideline 25. }
        o3_max_8h_mean_ugm3: { type: [integer, "null"], description: WHO 2021 guideline 100. }
        above_who_guideline: { type: array, items: { type: string, enum: [pm2_5, pm10, nitrogen_dioxide, ozone] } }
        naqi_pm25_band: { oneOf: [{ $ref: "#/components/schemas/Level" }, { type: "null" }], description: "India NAQI on the 24-h mean: 1 above 60, 2 above 120, 3 above 250." }
      additionalProperties: false

    Experimental:
      type: object
      description: >-
        Research-only model output. Returned only with include=experimental. Not validated for running and never for
        runner screens.
      required: [heat_budget, note]
      properties:
        heat_budget:
          oneOf:
            - type: "null"
            - type: object
              required: [model, uncompensable_heat, minutes_to_39c, suggested_max_pace_s_per_km, sweat_rate_ml_per_h, sweat_loss_ml, core_steady_c]
              properties:
                model: { type: string }
                uncompensable_heat: { type: boolean, description: Heat storage cannot be compensated at the planned pace in some run hour. }
                minutes_to_39c: { type: [integer, "null"], description: Only from uncompensable heat storage; null = no limit. }
                suggested_max_pace_s_per_km: { type: [integer, "null"] }
                sweat_rate_ml_per_h: { type: integer }
                sweat_loss_ml: { type: integer }
                core_steady_c: { type: number }
              additionalProperties: false
        note: { type: string }
      additionalProperties: false

    DataInfo:
      type: object
      required: [engine_version, status, not_assessed, unassessed_hours, sources, coverage]
      properties:
        engine_version: { type: string }
        status:
          type: string
          enum: [ok, degraded, unavailable]
          description: "ok = everything assessed; degraded = some factors not assessed (see not_assessed), the advice covers the rest; unavailable = no advice (503)."
        not_assessed:
          type: array
          description: Variables with missing data today. A pollutant listed here is not assessed, never assumed clean.
          items: { type: string, examples: [ozone, birch_pollen, wind_direction_10m] }
        unassessed_hours:
          type: array
          description: Local hours (HH:00) with missing weather essentials; they are left out of every window.
          items: { type: string, pattern: "^[0-2][0-9]:00$" }
        sources:
          type: array
          items:
            type: object
            required: [id, kind, variables]
            properties:
              id: { type: string, examples: [open-meteo-forecast, cams-europe] }
              kind: { type: string, enum: [forecast, model, observation, reanalysis, synthetic] }
              variables: { type: array, items: { type: string } }
              retrieved_at: { type: [string, "null"], format: date-time }
              age_s: { type: [integer, "null"], description: Age of the data at generated_at; null for stored or synthetic data. }
            additionalProperties: false
        coverage:
          type: object
          description: What could not be assessed here.
          properties:
            pollen: { type: string, enum: [covered, not_covered] }
            air_quality: { type: string, enum: [station_corrected, model_grid] }
          additionalProperties: { type: string }
      additionalProperties: false

    # ---------- live ----------
    LiveRequest:
      type: object
      description: Experimental.
      required: [recommendation_id, location, elapsed_s, speed_mps]
      properties:
        recommendation_id: { type: string, description: The id of the recommendation this run follows; the state is bound to it. }
        now: { type: string, format: date-time, description: Defaults to server time (for replays and tests). }
        location: { $ref: "#/components/schemas/LatLon" }
        elapsed_s: { type: integer, minimum: 0 }
        planned_duration_s: { type: integer, minimum: 300, maximum: 14400 }
        speed_mps: { type: number, minimum: 0, description: Current (smoothed) speed. }
        heart_rate_bpm: { type: [integer, "null"], description: Accepted in v1, used from v1.1. }
        athlete: { $ref: "#/components/schemas/RecommendationRequest/properties/athlete" }
        state: { type: [string, "null"], maxLength: 640, description: Opaque and signed; echo back unchanged from the previous response. }
      additionalProperties: false
    LiveResponse:
      type: object
      description: Experimental. Runner-facing alerts come from forecast facts only; body estimates are under `experimental`.
      required: [schema_version, at, recommendation_id, heat_level, alert, experimental, state]
      properties:
        schema_version: { type: string, const: "0.9.0" }
        at: { type: string, format: date-time }
        recommendation_id: { type: string }
        heat_level: { $ref: "#/components/schemas/Level" }
        alert:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LiveAlert"
        experimental:
          type: object
          description: Experimental heat-budget estimates. Not validated for running; never for runner screens.
          required: [core_estimate_c, core_status, limit_status, suggested_max_pace_s_per_km, body_alert, note]
          properties:
            core_estimate_c: { type: number, maximum: 40.5 }
            core_status: { type: string, enum: [normal, rising, at_limit] }
            limit_status: { type: string, enum: [none, capped, walk_only] }
            suggested_max_pace_s_per_km: { type: [integer, "null"] }
            body_alert: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/LiveAlert" }] }
            note: { type: string }
          additionalProperties: false
        state: { type: string }
      additionalProperties: false
    LiveAlert:
      type: object
      required: [code, level, params]
      properties:
        code: { type: string, enum: [WALK_AND_COOL, EASE_OFF, HEAD_HOME_HEAT, AIR_WORSENING, EASY_START_COLD, TURN_FOR_TAILWIND, DRINK] }
        level: { $ref: "#/components/schemas/Level" }
        params: { type: object }
        text: { type: string }
        haptic: { type: string, enum: [none, single, double, urgent] }
      additionalProperties: false

    Problem:
      type: object
      required: [type, title, status]
      properties:
        data: { $ref: "#/components/schemas/DataInfo" }
        type: { type: string, examples: ["https://api.gotime.example/problems/unsupported-location"] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        invalid_params:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              reason: { type: string }
