# Builds the phone demo (demo/) and publishes it on GitHub Pages.
# Needs, once: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Phone demo on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      # the demo bundles the shared engine, city data, adapter and message catalogue
      - "api/engine.js"
      - "api/locations.js"
      - "api/adapter.js"
      - "api/messages/**"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
      - name: Unit tests (engine parity with api/examples, journey, copy, scripts)
        run: npm run test:unit
      - name: Build (served under /<repository>/)
        run: npm run build
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
